<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Udgiftsrefusion{% endblock %} – Fritidsklubben</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    .status-pending  { @apply bg-yellow-100 text-yellow-800; }
    .status-approved { @apply bg-green-100 text-green-800; }
    .status-rejected { @apply bg-red-100 text-red-800; }
    .status-paid     { @apply bg-blue-100 text-blue-800; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 9999px; font-size: .75rem; font-weight: 600; }
    .badge-pending  { background:#fef9c3; color:#92400e; }
    .badge-approved { background:#dcfce7; color:#166534; }
    .badge-rejected { background:#fee2e2; color:#991b1b; }
    .badge-paid     { background:#dbeafe; color:#1e40af; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  {% if user %}
  <nav class="bg-white shadow-sm border-b border-gray-200">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/" class="font-bold text-lg text-indigo-700">Udgiftsrefusion</a>
      <div class="flex items-center gap-4">
        {% if user.is_admin %}
          <a href="/admin" class="text-sm text-gray-600 hover:text-indigo-700">Admin</a>
        {% else %}
          <a href="/mine-udgifter" class="text-sm text-gray-600 hover:text-indigo-700">Mine udgifter</a>
          <a href="/indsend-udgift" class="text-sm bg-indigo-600 text-white px-3 py-1.5 rounded-lg hover:bg-indigo-700">Indsend udgift</a>
        {% endif %}
        <span class="text-sm text-gray-500">{{ user.name }}</span>
        <a href="/logout" class="text-sm text-gray-400 hover:text-red-600">Log ud</a>
      </div>
    </div>
  </nav>
  {% endif %}
  <main class="max-w-5xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
